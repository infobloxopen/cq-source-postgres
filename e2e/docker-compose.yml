services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cq
      POSTGRES_PASSWORD: cq
      POSTGRES_DB: cq_test
    ports:
      - "5432:5432"
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=10
        -c max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cq -d cq_test"]
      interval: 5s
      timeout: 5s
      retries: 10
